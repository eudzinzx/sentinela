
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXORA Health | Farmácia Hospitalar</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --azul: #0b5ed7;
      --azul-escuro: #073b88;
      --ciano: #12b8d4;

      --verde: #16a36a;
      --verde-claro: #eafaf3;

      --texto: #172033;
      --cinza: #667085;
      --cinza-claro: #98a2b3;

      --borda: #dfe6ee;

      --fundo: #f4f8fc;
      --branco: #ffffff;

      --sombra:
        0 15px 40px rgba(25, 65, 110, 0.09);
    }

    body {

      min-height: 100vh;

      font-family:
        "Inter",
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(18, 184, 212, 0.12),
          transparent 28%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(11, 94, 215, 0.09),
          transparent 30%
        ),
        var(--fundo);

      color: var(--texto);

    }


    /* ==================================
       CONTAINER
    ================================== */

    .container {

      width: 100%;

      max-width: 1100px;

      margin: 0 auto;

      padding: 30px 20px 50px;

    }


    /* ==================================
       HEADER
    ================================== */

    header {

      position: relative;

      overflow: hidden;

      display: flex;

      align-items: center;

      gap: 20px;

      padding: 28px 32px;

      margin-bottom: 25px;

      border-radius: 22px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--azul-escuro),
          var(--azul),
          #087fae
        );

      box-shadow:
        0 15px 35px rgba(11, 94, 215, 0.18);

    }


    header::after {

      content: "";

      position: absolute;

      width: 250px;
      height: 250px;

      border-radius: 50%;

      right: -100px;
      top: -120px;

      background:
        rgba(255, 255, 255, 0.07);

    }


    .logo {

      position: relative;

      z-index: 1;

      width: 62px;
      height: 62px;

      display: flex;

      justify-content: center;
      align-items: center;

      flex-shrink: 0;

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.13);

      border:
        1px solid rgba(255, 255, 255, 0.22);

      font-size: 30px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.12);

    }


    .header-text {

      position: relative;

      z-index: 1;

    }


    .marca {

      font-size: 13px;

      font-weight: 600;

      color:
        rgba(255, 255, 255, 0.72);

      margin-bottom: 4px;

      letter-spacing: 0.4px;

      text-transform: uppercase;

    }


    header h1 {

      font-size: 27px;

      letter-spacing: -0.7px;

      margin-bottom: 5px;

    }


    header p {

      color:
        rgba(255, 255, 255, 0.78);

      font-size: 14px;

    }


    .status {

      position: relative;

      z-index: 2;

      margin-left: auto;

      padding: 9px 14px;

      border-radius: 50px;

      background:
        rgba(255, 255, 255, 0.11);

      border:
        1px solid rgba(255, 255, 255, 0.18);

      font-size: 12px;

      white-space: nowrap;

    }


    .status::before {

      content: "";

      display: inline-block;

      width: 7px;
      height: 7px;

      margin-right: 7px;

      border-radius: 50%;

      background: #55e6a5;

      box-shadow:
        0 0 8px #55e6a5;

    }


    /* ==================================
       BARRA DE INFORMAÇÕES
    ================================== */

    .barra {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 20px;

      padding: 20px 22px;

      background: white;

      border: 1px solid var(--borda);

      border-radius: 16px;

      box-shadow: var(--sombra);

    }


    .informacao {

      display: flex;

      align-items: center;

      gap: 13px;

    }


    .icone-info {

      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: #eef5ff;

      color: var(--azul);

      font-size: 19px;

    }


    .informacao strong {

      display: block;

      font-size: 15px;

      margin-bottom: 3px;

    }


    .informacao span {

      font-size: 12px;

      color: var(--cinza);

    }


    .contador {

      padding: 9px 14px;

      border-radius: 10px;

      background: var(--verde-claro);

      color: var(--verde);

      font-size: 13px;

      font-weight: 700;

      white-space: nowrap;

    }


    /* ==================================
       LISTA
    ================================== */

    .lista {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 18px;

    }


    /* ==================================
       CARD
    ================================== */

    .card {

      position: relative;

      padding: 23px;

      background: white;

      border: 1px solid var(--borda);

      border-radius: 18px;

      box-shadow: var(--sombra);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;

      overflow: hidden;

    }


    .card::before {

      content: "";

      position: absolute;

      left: 0;
      top: 0;

      width: 4px;
      height: 100%;

      background:
        linear-gradient(
          180deg,
          var(--azul),
          var(--ciano)
        );

    }


    .card:hover {

      transform:
        translateY(-3px);

      border-color:
        #c8d7e8;

      box-shadow:
        0 20px 45px
        rgba(25, 65, 110, 0.13);

    }


    /* ==================================
       CABEÇALHO DO CARD
    ================================== */

    .titulo {

      display: flex;

      align-items: center;

      gap: 11px;

      padding-bottom: 17px;

      margin-bottom: 17px;

      border-bottom:
        1px solid #edf0f4;

    }


    .avatar {

      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 12px;

      color: var(--azul);

      background:
        #eef5ff;

      font-size: 19px;

    }


    .paciente {

      min-width: 0;

    }


    .paciente small {

      display: block;

      color: var(--cinza);

      font-size: 11px;

      margin-bottom: 3px;

      text-transform: uppercase;

      letter-spacing: 0.5px;

    }


    .paciente strong {

      display: block;

      font-size: 16px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    /* ==================================
       DADOS DA PRESCRIÇÃO
    ================================== */

    .dados {

      display: flex;

      flex-direction: column;

      gap: 13px;

    }


    .dado {

      display: flex;

      align-items: flex-start;

      gap: 11px;

    }


    .dado-icone {

      width: 32px;
      height: 32px;

      display: flex;

      justify-content: center;
      align-items: center;

      flex-shrink: 0;

      border-radius: 9px;

      background: #f5f8fc;

      font-size: 14px;

    }


    .dado-conteudo {

      flex: 1;

      min-width: 0;

    }


    .dado-conteudo span {

      display: block;

      color: var(--cinza);

      font-size: 11px;

      margin-bottom: 3px;

    }


    .dado-conteudo strong {

      display: block;

      font-size: 13px;

      line-height: 1.4;

    }


    /* ==================================
       MEDICAÇÃO
    ================================== */

    .medicacao {

      padding: 13px;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #f0f7ff,
          #f7fbff
        );

      border:
        1px solid #e1ecf8;

    }


    .medicacao .dado-icone {

      background:
        #dcecff;

    }


    /* ==================================
       OBSERVAÇÃO
    ================================== */

    .observacao {

      margin-top: 17px;

      padding-top: 16px;

      border-top:
        1px solid #edf0f4;

      font-size: 12px;

      line-height: 1.5;

      color: var(--cinza);

    }


    .observacao strong {

      color: #475467;

    }


    /* ==================================
       SEM DADOS
    ================================== */

    .sem-dados {

      grid-column: 1 / -1;

      padding: 60px 30px;

      text-align: center;

      background: white;

      border:
        1px solid var(--borda);

      border-radius: 18px;

      color: var(--cinza);

      box-shadow: var(--sombra);

    }


    .sem-dados .icone-vazio {

      width: 65px;
      height: 65px;

      display: flex;

      align-items: center;
      justify-content: center;

      margin: 0 auto 17px;

      border-radius: 18px;

      background: #eef5ff;

      font-size: 27px;

    }


    .sem-dados strong {

      display: block;

      color: var(--texto);

      margin-bottom: 6px;

      font-size: 16px;

    }


    /* ==================================
       LOADING
    ================================== */

    .loading {

      grid-column: 1 / -1;

      padding: 50px;

      text-align: center;

      color: var(--cinza);

      background: white;

      border-radius: 18px;

      border: 1px solid var(--borda);

    }


    .spinner {

      width: 35px;
      height: 35px;

      margin: 0 auto 15px;

      border:
        3px solid #e4edf7;

      border-top-color:
        var(--azul);

      border-radius: 50%;

      animation:
        girar 0.8s linear infinite;

    }


    @keyframes girar {

      to {
        transform: rotate(360deg);
      }

    }


    /* ==================================
       ERRO
    ================================== */

    .erro {

      grid-column: 1 / -1;

      padding: 25px;

      text-align: center;

      background: #fff5f5;

      color: #b42318;

      border:
        1px solid #fecdca;

      border-radius: 15px;

      font-size: 14px;

    }


    /* ==================================
       RESPONSIVO
    ================================== */

    @media (max-width: 750px) {

      .lista {

        grid-template-columns: 1fr;

      }

      .status {

        display: none;

      }

    }


    @media (max-width: 550px) {

      .container {

        padding:
          15px 12px 35px;

      }


      header {

        padding: 23px 20px;

        border-radius: 18px;

      }


      .logo {

        width: 50px;
        height: 50px;

        font-size: 24px;

      }


      header h1 {

        font-size: 21px;

      }


      header p {

        font-size: 12px;

      }


      .barra {

        align-items: flex-start;

        flex-direction: column;

        padding: 17px;

      }


      .contador {

        width: 100%;

        text-align: center;

      }


      .card {

        padding: 19px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ==================================
       CABEÇALHO
  =================================== -->

  <header>

    <div class="logo">
      💊
    </div>

    <div class="header-text">

      <div class="marca">
        NEXORA Health
      </div>

      <h1>
        Farmácia Hospitalar
      </h1>

      <p>
        Gestão e acompanhamento de prescrições médicas
      </p>

    </div>

    <div class="status">
      Sistema online
    </div>

  </header>


  <!-- ==================================
       INFORMAÇÕES
  =================================== -->

  <div class="barra">

    <div class="informacao">

      <div class="icone-info">
        📋
      </div>

      <div>

        <strong>
          Prescrições médicas
        </strong>

        <span>
          Medicamentos aguardando atendimento da farmácia
        </span>

      </div>

    </div>


    <div
      id="contador"
      class="contador"
    >
      Carregando...
    </div>

  </div>


  <!-- ==================================
       LISTA DE MEDICAÇÕES
  =================================== -->

  <div
    id="listaMedicacoes"
    class="lista"
  >

    <div class="loading">

      <div class="spinner"></div>

      Carregando prescrições...

    </div>

  </div>


</div>


<script>


/* ==================================
   CARREGAR MEDICAÇÕES
================================== */

function carregarMedicacoesPrescritas() {

  const div =
    document.getElementById(
      "listaMedicacoes"
    );

  const contador =
    document.getElementById(
      "contador"
    );


  div.innerHTML = `
    <div class="loading">

      <div class="spinner"></div>

      Carregando prescrições...

    </div>
  `;


  fetch("/medicacoes")

    .then(resposta => {

      if (!resposta.ok) {

        throw new Error(
          "Não foi possível carregar as medicações."
        );

      }

      return resposta.json();

    })

    .then(data => {

      div.innerHTML = "";


      /* ==============================
         NENHUMA PRESCRIÇÃO
      ============================== */

      if (!data || data.length === 0) {

        contador.textContent =
          "0 prescrições pendentes";

        div.innerHTML = `

          <div class="sem-dados">

            <div class="icone-vazio">
              📋
            </div>

            <strong>
              Nenhuma prescrição no momento
            </strong>

            <span>
              Não existem medicamentos aguardando
              atendimento da farmácia.
            </span>

          </div>

        `;

        return;

      }


      /* ==============================
         CONTADOR
      ============================== */

      const quantidade =
        data.length;

      contador.textContent =
        quantidade === 1
          ? "1 prescrição pendente"
          : `${quantidade} prescrições pendentes`;


      /* ==============================
         CARDS
      ============================== */

      data.forEach(c => {

        const paciente =
          escaparHTML(
            c.paciente || "Paciente não informado"
          );

        const medicacao =
          escaparHTML(
            c.medicacao || "Não informado"
          );

        const diagnostico =
          escaparHTML(
            c.diagnostico || "Não informado"
          );

        const observacao =
          escaparHTML(
            c.obs || "Nenhuma observação."
          );


        div.innerHTML += `

          <div class="card">

            <div class="titulo">

              <div class="avatar">
                👤
              </div>

              <div class="paciente">

                <small>
                  Paciente
                </small>

                <strong>
                  ${paciente}
                </strong>

              </div>

            </div>


            <div class="dados">


              <!-- MEDICAÇÃO -->

              <div class="dado medicacao">

                <div class="dado-icone">
                  💊
                </div>

                <div class="dado-conteudo">

                  <span>
                    Medicação prescrita
                  </span>

                  <strong>
                    ${medicacao}
                  </strong>

                </div>

              </div>


              <!-- DIAGNÓSTICO -->

              <div class="dado">

                <div class="dado-icone">
                  🩺
                </div>

                <div class="dado-conteudo">

                  <span>
                    Diagnóstico
                  </span>

                  <strong>
                    ${diagnostico}
                  </strong>

                </div>

              </div>

            </div>


            <!-- OBSERVAÇÕES -->

            <div class="observacao">

              <strong>
                📝 Observações:
              </strong>

              ${observacao}

            </div>

          </div>

        `;

      });

    })

    .catch(erro => {

      console.error(erro);


      contador.textContent =
        "Erro ao carregar";


      div.innerHTML = `

        <div class="erro">

          ⚠️
          <strong>
            Não foi possível carregar as prescrições.
          </strong>

          <br><br>

          Verifique se o servidor está ativo
          e tente novamente.

        </div>

      `;

    });

}


/* ==================================
   PROTEÇÃO CONTRA HTML INJETADO
================================== */

function escaparHTML(texto) {

  return String(texto)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ==================================
   INICIAR
================================== */

carregarMedicacoesPrescritas();


/*
 * Atualiza automaticamente a cada 30 segundos.
 */

setInterval(
  carregarMedicacoesPrescritas,
  30000
);


</script>


</body>

</html>
```
