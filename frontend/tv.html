<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXORA Health | Chamada</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    :root {

      --azul: #0b5ed7;
      --azul-escuro: #061d46;
      --azul-profundo: #073b88;

      --ciano: #14b8d4;
      --ciano-claro: #67e8f9;

      --branco: #ffffff;
      --branco-suave: rgba(255,255,255,0.88);

      --borda: rgba(255,255,255,0.18);

    }


    body {

      min-height: 100vh;

      font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

      background:

        radial-gradient(
          circle at 15% 20%,
          rgba(20,184,212,0.22),
          transparent 28%
        ),

        radial-gradient(
          circle at 85% 10%,
          rgba(11,94,215,0.35),
          transparent 35%
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(20,184,212,0.18),
          transparent 35%
        ),

        linear-gradient(
          135deg,
          #03122d,
          #061d46,
          #073b88,
          #087fae
        );

      color: white;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 35px;

    }


    /* =================================
       FUNDO DECORATIVO
    ================================= */

    body::before {

      content: "";

      position: fixed;

      width: 600px;
      height: 600px;

      border-radius: 50%;

      background:
        rgba(20,184,212,0.06);

      filter: blur(5px);

      top: -300px;
      right: -200px;

      pointer-events: none;

    }


    body::after {

      content: "";

      position: fixed;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      background:
        rgba(11,94,215,0.10);

      bottom: -250px;
      left: -180px;

      pointer-events: none;

    }


    /* =================================
       TELA PRINCIPAL
    ================================= */

    .tela {

      width: 100%;

      max-width: 1250px;

      min-height: 720px;

      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 55px;

      border-radius: 38px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.13),
          rgba(255,255,255,0.055)
        );

      border:
        1px solid
        var(--borda);

      backdrop-filter:
        blur(25px);

      box-shadow:
        0 35px 100px
        rgba(0,0,0,0.38);

      overflow: hidden;

    }


    .tela::before {

      content: "";

      position: absolute;

      width: 520px;
      height: 520px;

      border-radius: 50%;

      background:
        rgba(20,184,212,0.07);

      top: -270px;
      right: -180px;

    }


    .tela::after {

      content: "";

      position: absolute;

      width: 400px;
      height: 400px;

      border-radius: 50%;

      background:
        rgba(11,94,215,0.08);

      bottom: -230px;
      left: -160px;

    }


    /* =================================
       CABEÇALHO
    ================================= */

    .cabecalho {

      position: absolute;

      top: 28px;

      left: 35px;
      right: 35px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      z-index: 5;

    }


    .logo-area {

      display: flex;

      align-items: center;

      gap: 13px;

    }


    .logo-icon {

      width: 52px;
      height: 52px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          var(--azul),
          var(--ciano)
        );

      font-size: 27px;

      box-shadow:
        0 8px 25px
        rgba(20,184,212,0.25);

    }


    .logo-texto {

      text-align: left;

    }


    .logo-texto strong {

      display: block;

      font-size: 18px;

      font-weight: 900;

      letter-spacing: 1.5px;

    }


    .logo-texto span {

      font-size: 10px;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0.65;

    }


    /* =================================
       RELÓGIO
    ================================= */

    .relogio-area {

      text-align: right;

    }


    .relogio {

      font-size: 23px;

      font-weight: 800;

      letter-spacing: 1px;

    }


    .data {

      margin-top: 3px;

      font-size: 11px;

      opacity: 0.65;

      text-transform: capitalize;

    }


    /* =================================
       CONTEÚDO
    ================================= */

    .conteudo {

      position: relative;

      z-index: 3;

      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    .status-chamada {

      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding:
        9px 17px;

      border-radius: 30px;

      background:
        rgba(20,184,212,0.12);

      border:
        1px solid
        rgba(103,232,249,0.20);

      color:
        var(--ciano-claro);

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;

      margin-bottom: 18px;

    }


    .ponto {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background:
        var(--ciano-claro);

      box-shadow:
        0 0 12px
        var(--ciano-claro);

      animation:
        pulsar 1.5s infinite;

    }


    @keyframes pulsar {

      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.7);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }


    .titulo {

      font-size: 20px;

      font-weight: 500;

      color:
        var(--branco-suave);

      margin-bottom: 30px;

    }


    /* =================================
       ÍCONE
    ================================= */

    .icone {

      width: 90px;
      height: 90px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          rgba(11,94,215,0.30),
          rgba(20,184,212,0.18)
        );

      border:
        1px solid
        rgba(255,255,255,0.20);

      font-size: 40px;

      margin-bottom: 25px;

      box-shadow:
        0 15px 35px
        rgba(0,0,0,0.18);

    }


    /* =================================
       NOME
    ================================= */

    .nome {

      font-size:
        clamp(
          42px,
          7vw,
          82px
        );

      font-weight: 900;

      line-height: 1;

      max-width: 1000px;

      margin-bottom: 42px;

      letter-spacing: -2px;

      text-shadow:
        0 10px 35px
        rgba(0,0,0,0.30);

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;

    }


    .nome.nova-chamada {

      animation:
        aparecer 0.8s ease;

    }


    @keyframes aparecer {

      0% {

        opacity: 0;

        transform:
          scale(0.92)
          translateY(15px);

      }

      100% {

        opacity: 1;

        transform:
          scale(1)
          translateY(0);

      }

    }


    /* =================================
       INFORMAÇÕES
    ================================= */

    .informacoes {

      width: 100%;

      max-width: 820px;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 22px;

    }


    .info {

      position: relative;

      padding:
        27px 30px;

      border-radius: 22px;

      background:
        rgba(255,255,255,0.10);

      border:
        1px solid
        rgba(255,255,255,0.16);

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.06);

      overflow: hidden;

    }


    .info::before {

      content: "";

      position: absolute;

      width: 100px;
      height: 100px;

      border-radius: 50%;

      background:
        rgba(20,184,212,0.08);

      top: -50px;
      right: -30px;

    }


    .info span {

      position: relative;

      display: block;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 2.5px;

      text-transform: uppercase;

      opacity: 0.60;

      margin-bottom: 10px;

    }


    .info strong {

      position: relative;

      display: block;

      font-size: 43px;

      font-weight: 900;

      color: white;

    }


    /* =================================
       RODAPÉ
    ================================= */

    .rodape {

      position: relative;

      z-index: 3;

      margin-top: 35px;

      display: flex;

      flex-direction: column;

      gap: 7px;

    }


    .rodape-principal {

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 1px;

      opacity: 0.75;

    }


    .rodape-secundario {

      font-size: 10px;

      opacity: 0.40;

    }


    /* =================================
       ESTADO SEM CHAMADA
    ================================= */

    .aguardando {

      opacity: 0.65;

    }


    /* =================================
       RESPONSIVO
    ================================= */

    @media (max-width: 700px) {

      body {

        padding: 12px;

      }


      .tela {

        min-height: 650px;

        padding:
          90px 20px 35px;

        border-radius: 25px;

      }


      .cabecalho {

        top: 18px;

        left: 20px;
        right: 20px;

      }


      .logo-icon {

        width: 43px;
        height: 43px;

        font-size: 22px;

      }


      .logo-texto strong {

        font-size: 14px;

      }


      .logo-texto span {

        font-size: 8px;

      }


      .relogio {

        font-size: 17px;

      }


      .data {

        font-size: 9px;

      }


      .titulo {

        font-size: 16px;

      }


      .icone {

        width: 75px;
        height: 75px;

        font-size: 32px;

      }


      .nome {

        font-size: 40px;

        letter-spacing: -1px;

      }


      .informacoes {

        grid-template-columns: 1fr;

        gap: 12px;

      }


      .info {

        padding: 20px;

      }


      .info strong {

        font-size: 32px;

      }

    }

  </style>

</head>


<body>


  <main class="tela">


    <!-- =========================
         CABEÇALHO
    ========================= -->

    <header class="cabecalho">


      <div class="logo-area">

        <div class="logo-icon">
          🩺
        </div>


        <div class="logo-texto">

          <strong>
            NEXORA
          </strong>

          <span>
            Health
          </span>

        </div>

      </div>


      <div class="relogio-area">

        <div
          class="relogio"
          id="relogio"
        >
          00:00
        </div>


        <div
          class="data"
          id="data"
        >
          carregando...
        </div>

      </div>


    </header>



    <!-- =========================
         CONTEÚDO
    ========================= -->

    <div class="conteudo">


      <div class="status-chamada">

        <div class="ponto"></div>

        CHAMADA DE PACIENTE

      </div>


      <div class="titulo">

        Por favor, dirija-se ao local indicado

      </div>


      <div class="icone">
        🏥
      </div>


      <div
        class="nome"
        id="nomePaciente"
      >

        Aguardando chamada...

      </div>



      <!-- =========================
           SALA E GUICHÊ
      ========================= -->

      <section class="informacoes">


        <div class="info">

          <span>
            Sala
          </span>


          <strong
            id="salaPaciente"
          >
            —
          </strong>

        </div>



        <div class="info">

          <span>
            Guichê
          </span>


          <strong
            id="guichePaciente"
          >
            —
          </strong>

        </div>


      </section>


    </div>



    <!-- =========================
         RODAPÉ
    ========================= -->

    <footer class="rodape">


      <div
        class="rodape-principal"
        id="horario"
      >

        NEXORA Health • Aguardando atendimento

      </div>


      <div class="rodape-secundario">

        Em caso de dúvida, procure a recepção.

      </div>


    </footer>


  </main>



  <script>


    /* =================================
       RELÓGIO
    ================================= */

    function atualizarRelogio() {

      const agora =
        new Date();


      document.getElementById(
        "relogio"
      ).textContent =
        agora.toLocaleTimeString(
          "pt-BR",
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        );


      document.getElementById(
        "data"
      ).textContent =
        agora.toLocaleDateString(
          "pt-BR",
          {
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
          }
        );

    }


    atualizarRelogio();


    setInterval(
      atualizarRelogio,
      1000
    );



    /* =================================
       CARREGAR CHAMADA
    ================================= */

    let ultimaChamada = "";


    function carregarChamada() {


      const dados =
        localStorage.getItem(
          "chamadaTV"
        );


      const nome =
        document.getElementById(
          "nomePaciente"
        );


      const sala =
        document.getElementById(
          "salaPaciente"
        );


      const guiche =
        document.getElementById(
          "guichePaciente"
        );


      const horario =
        document.getElementById(
          "horario"
        );


      /* =========================
         SEM CHAMADA
      ========================= */

      if (!dados) {

        nome.textContent =
          "Aguardando chamada...";

        nome.classList.add(
          "aguardando"
        );

        sala.textContent =
          "—";

        guiche.textContent =
          "—";

        horario.textContent =
          "NEXORA Health • Aguardando atendimento";

        return;

      }


      try {


        const chamada =
          JSON.parse(
            dados
          );


        const nomePaciente =
          chamada.nome ||
          "Paciente";


        const salaPaciente =
          chamada.sala ||
          "—";


        const guichePaciente =
          chamada.guiche ||
          "—";


        const horarioChamada =
          chamada.horario ||
          "";


        /*
          Verifica se é uma
          chamada nova.
        */

        const identificador =
          nomePaciente +
          "|" +
          salaPaciente +
          "|" +
          guichePaciente +
          "|" +
          horarioChamada;


        if (
          identificador !==
          ultimaChamada
        ) {

          ultimaChamada =
            identificador;


          nome.classList.remove(
            "nova-chamada"
          );


          void nome.offsetWidth;


          nome.classList.remove(
            "aguardando"
          );


          nome.classList.add(
            "nova-chamada"
          );

        }


        nome.textContent =
          nomePaciente;


        sala.textContent =
          salaPaciente;


        guiche.textContent =
          guichePaciente;


        horario.textContent =
          "NEXORA Health • " +
          (
            horarioChamada
              ? "Chamada realizada às " +
                horarioChamada
              : "Paciente chamado"
          );


      }


      catch (erro) {

        console.error(
          "Erro ao carregar chamada:",
          erro
        );

      }

    }



    /* =================================
       INICIALIZAÇÃO
    ================================= */

    carregarChamada();


    /*
      Atualiza a tela automaticamente.
    */

    setInterval(
      carregarChamada,
      1000
    );


  </script>


</body>

</html>
