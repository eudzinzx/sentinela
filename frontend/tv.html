<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Hospital Áurea | Chamada de Pacientes</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================================
       VARIÁVEIS
    ========================================= */

    :root {

      --azul: #063b52;
      --azul-claro: #075b78;
      --azul-profundo: #021e2b;

      --dourado: #d6a73a;
      --dourado-claro: #f3d47a;

      --branco: #ffffff;

    }


    /* =========================================
       BODY
    ========================================= */

    body {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--branco);

      background:

        radial-gradient(
          circle at 15% 20%,
          rgba(214, 167, 58, .16),
          transparent 28%
        ),

        radial-gradient(
          circle at 85% 80%,
          rgba(20, 157, 185, .20),
          transparent 30%
        ),

        radial-gradient(
          circle at 80% 10%,
          rgba(255, 255, 255, .07),
          transparent 20%
        ),

        linear-gradient(
          135deg,
          #021d29,
          #063b52,
          #075b78
        );

      overflow: hidden;

    }


    /* =========================================
       EFEITO DE FUNDO
    ========================================= */

    body::before {

      content: "";

      position: fixed;

      width: 700px;

      height: 700px;

      border-radius: 50%;

      border:
        1px solid
        rgba(214, 167, 58, .10);

      top: -350px;

      right: -250px;

      box-shadow:

        0 0 0 70px
        rgba(214, 167, 58, .025),

        0 0 0 140px
        rgba(214, 167, 58, .02);

      pointer-events: none;

    }


    body::after {

      content: "";

      position: fixed;

      width: 500px;

      height: 500px;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,.05);

      bottom: -280px;

      left: -180px;

      pointer-events: none;

    }


    /* =========================================
       CONTAINER
    ========================================= */

    .container {

      width: 92%;

      max-width: 1250px;

      text-align: center;

      position: relative;

      z-index: 2;

    }


    /* =========================================
       CABEÇALHO
    ========================================= */

    .cabecalho {

      display: flex;

      flex-direction: column;

      align-items: center;

      margin-bottom: 28px;

    }


    /* =========================================
       LOGO
    ========================================= */

    .logo-container {

      width: 135px;

      height: 135px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-bottom: 15px;

      border-radius: 50%;

      background:

        rgba(255,255,255,.96);

      border:

        3px solid
        rgba(214,167,58,.85);

      box-shadow:

        0 0 0 8px
        rgba(214,167,58,.08),

        0 0 45px
        rgba(214,167,58,.25),

        0 18px 50px
        rgba(0,0,0,.28);

      animation:
        logoPulse 4s ease-in-out infinite;

      overflow: hidden;

    }


    .logo-container img {

      width: 105px;

      height: 105px;

      object-fit: contain;

    }


    @keyframes logoPulse {

      0%, 100% {

        transform: scale(1);

        box-shadow:

          0 0 0 8px
          rgba(214,167,58,.08),

          0 0 35px
          rgba(214,167,58,.20),

          0 18px 50px
          rgba(0,0,0,.28);

      }

      50% {

        transform: scale(1.025);

        box-shadow:

          0 0 0 12px
          rgba(214,167,58,.06),

          0 0 60px
          rgba(214,167,58,.35),

          0 20px 55px
          rgba(0,0,0,.30);

      }

    }


    /* =========================================
       MARCA
    ========================================= */

    .marca {

      font-size: 14px;

      font-weight: 700;

      letter-spacing: 5px;

      text-transform: uppercase;

      color:
        var(--dourado-claro);

      margin-bottom: 8px;

    }


    h1 {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(28px, 4vw, 42px);

      font-weight: 500;

      letter-spacing: .5px;

    }


    .linha-dourada {

      width: 120px;

      height: 2px;

      margin: 14px auto 0;

      background:

        linear-gradient(
          90deg,
          transparent,
          var(--dourado),
          transparent
        );

    }


    /* =========================================
       CARD PRINCIPAL
    ========================================= */

    .chamada {

      position: relative;

      padding:
        48px 45px 42px;

      border-radius: 32px;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,.14),
          rgba(255,255,255,.06)
        );

      border:
        1px solid
        rgba(255,255,255,.17);

      box-shadow:

        0 30px 80px
        rgba(0,0,0,.30),

        inset 0 1px 0
        rgba(255,255,255,.12);

      backdrop-filter:
        blur(20px);

      overflow: hidden;

    }


    .chamada::before {

      content: "";

      position: absolute;

      top: 0;

      left: 10%;

      right: 10%;

      height: 2px;

      background:

        linear-gradient(
          90deg,
          transparent,
          var(--dourado),
          var(--dourado-claro),
          var(--dourado),
          transparent
        );

      box-shadow:
        0 0 18px
        rgba(214,167,58,.6);

    }


    .chamada::after {

      content: "";

      position: absolute;

      width: 280px;

      height: 280px;

      border-radius: 50%;

      background:
        rgba(214,167,58,.04);

      right: -150px;

      bottom: -150px;

      pointer-events: none;

    }


    /* =========================================
       STATUS
    ========================================= */

    .status {

      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding:
        8px 17px;

      margin-bottom: 18px;

      border-radius: 50px;

      background:
        rgba(214,167,58,.12);

      border:
        1px solid
        rgba(214,167,58,.25);

      color:
        var(--dourado-claro);

      font-size: 13px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 1.5px;

    }


    .status-ponto {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background:
        #53e38a;

      box-shadow:
        0 0 12px
        #53e38a;

      animation:
        piscar 1.5s infinite;

    }


    @keyframes piscar {

      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: .35;
      }

    }


    /* =========================================
       LABEL
    ========================================= */

    .label {

      margin-bottom: 15px;

      font-size: 17px;

      color:
        rgba(255,255,255,.68);

    }


    /* =========================================
       NOME DO PACIENTE
    ========================================= */

    #nomePaciente {

      min-height: 105px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(48px, 7vw, 92px);

      font-weight: 700;

      line-height: 1;

      letter-spacing: -2px;

      color: white;

      text-shadow:

        0 3px 25px
        rgba(0,0,0,.25);

      word-break: break-word;

    }


    .aguardando {

      color:
        rgba(255,255,255,.45) !important;

      font-size:
        clamp(32px, 5vw, 55px) !important;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif !important;

      font-weight: 400 !important;

      letter-spacing: -1px !important;

    }


    /* =========================================
       LOCALIZAÇÃO
    ========================================= */

    .localizacao {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 20px;

      max-width: 850px;

      margin:
        38px auto 0;

    }


    .local-box {

      position: relative;

      padding:
        24px;

      border-radius: 20px;

      background:

        rgba(0,0,0,.13);

      border:
        1px solid
        rgba(255,255,255,.10);

      transition:
        transform .3s,
        border-color .3s;

    }


    .local-box:hover {

      transform:
        translateY(-4px);

      border-color:
        rgba(214,167,58,.45);

    }


    .local-icone {

      font-size: 25px;

      margin-bottom: 9px;

      filter:
        drop-shadow(
          0 0 7px
          rgba(214,167,58,.35)
        );

    }


    .local-label {

      font-size: 12px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 2px;

      color:
        rgba(255,255,255,.50);

      margin-bottom: 6px;

    }


    .local-valor {

      font-size: 35px;

      font-weight: 800;

      color:
        var(--dourado-claro);

      text-shadow:
        0 0 18px
        rgba(214,167,58,.15);

    }


    /* =========================================
       HORÁRIO
    ========================================= */

    #horario {

      margin-top: 25px;

      font-size: 14px;

      color:
        rgba(255,255,255,.52);

    }


    /* =========================================
       ANIMAÇÃO PACIENTE
    ========================================= */

    .novo-paciente {

      animation:
        aparecer .8s
        cubic-bezier(.17,.67,.32,1.3);

    }


    @keyframes aparecer {

      0% {

        opacity: 0;

        transform:
          scale(.75)
          translateY(25px);

        filter:
          blur(8px);

      }

      100% {

        opacity: 1;

        transform:
          scale(1)
          translateY(0);

        filter:
          blur(0);

      }

    }


    /* =========================================
       RODAPÉ
    ========================================= */

    .rodape {

      margin-top: 25px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      font-size: 13px;

      color:
        rgba(255,255,255,.48);

    }


    .rodape span {

      color:
        var(--dourado);

    }


    /* =========================================
       RELÓGIO
    ========================================= */

    .relogio {

      position: fixed;

      top: 25px;

      right: 30px;

      padding:
        9px 15px;

      border-radius: 12px;

      background:
        rgba(0,0,0,.15);

      border:
        1px solid
        rgba(255,255,255,.10);

      color:
        rgba(255,255,255,.65);

      font-size: 13px;

      backdrop-filter:
        blur(10px);

    }


    /* =========================================
       RESPONSIVO
    ========================================= */

    @media (max-width: 700px) {

      body {

        overflow-y: auto;

        padding:
          30px 0;

      }


      .logo-container {

        width: 105px;

        height: 105px;

      }


      .logo-container img {

        width: 82px;

        height: 82px;

      }


      .marca {

        font-size: 11px;

        letter-spacing: 3px;

      }


      .chamada {

        padding:
          38px 18px 30px;

      }


      #nomePaciente {

        min-height: 80px;

        font-size:
          clamp(38px, 11vw, 65px);

      }


      .localizacao {

        grid-template-columns: 1fr;

        gap: 12px;

      }


      .local-box {

        padding: 18px;

      }


      .local-valor {

        font-size: 28px;

      }


      .relogio {

        position: static;

        width: fit-content;

        margin: 0 auto 20px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       RELÓGIO
  ========================================= -->

  <div
    class="relogio"
    id="relogio"
  >
    --:--:--
  </div>


  <main class="container">


    <!-- =========================================
         CABEÇALHO
    ========================================= -->

    <header class="cabecalho">


      <!-- LOGO DO HOSPITAL -->

      <div class="logo-container">

        <img
          src="img.hp.png"
          alt="Logo Hospital Áurea"
        >

      </div>


      <div class="marca">
        Hospital Áurea
      </div>


      <h1>
        Chamada de Pacientes
      </h1>


      <div class="linha-dourada"></div>


    </header>


    <!-- =========================================
         CARD
    ========================================= -->

    <section class="chamada">


      <!-- STATUS -->

      <div class="status">

        <span class="status-ponto"></span>

        Sistema de atendimento

      </div>


      <!-- LABEL -->

      <div class="label">
        Chamando paciente
      </div>


      <!-- NOME -->

      <div
        id="nomePaciente"
        class="aguardando"
      >
        Aguardando chamada...
      </div>


      <!-- =======================================
           SALA / GUICHÊ
      ======================================== -->

      <div class="localizacao">


        <!-- SALA -->

        <div class="local-box">

          <div class="local-icone">
            🚪
          </div>

          <div class="local-label">
            Sala
          </div>

          <div
            id="sala"
            class="local-valor"
          >
            —
          </div>

        </div>


        <!-- GUICHÊ -->

        <div class="local-box">

          <div class="local-icone">
            🪪
          </div>

          <div class="local-label">
            Guichê
          </div>

          <div
            id="guiche"
            class="local-valor"
          >
            —
          </div>

        </div>


      </div>


      <!-- HORÁRIO -->

      <div id="horario"></div>


    </section>


    <!-- =========================================
         RODAPÉ
    ========================================= -->

    <div class="rodape">

      <span>✦</span>

      Por favor, dirija-se ao local indicado acima.

      <span>✦</span>

    </div>


  </main>


  <script>


    /* =========================================
       ELEMENTOS
    ========================================= */

    const nomePaciente =
      document.getElementById(
        "nomePaciente"
      );


    const sala =
      document.getElementById(
        "sala"
      );


    const guiche =
      document.getElementById(
        "guiche"
      );


    const horario =
      document.getElementById(
        "horario"
      );


    const relogio =
      document.getElementById(
        "relogio"
      );


    /* =========================================
       RELÓGIO
    ========================================= */

    function atualizarRelogio() {

      const agora =
        new Date();


      relogio.textContent =
        agora.toLocaleTimeString(
          "pt-BR"
        );

    }


    setInterval(
      atualizarRelogio,
      1000
    );


    atualizarRelogio();


    /* =========================================
       ATUALIZAR TV
    ========================================= */

    function atualizarTV() {


      const dados =
        localStorage.getItem(
          "pacienteTV"
        );


      /* =====================================
         SEM CHAMADA
      ===================================== */

      if (!dados) {

        nomePaciente.textContent =
          "Aguardando chamada...";

        nomePaciente.classList.add(
          "aguardando"
        );

        sala.textContent =
          "—";

        guiche.textContent =
          "—";

        horario.textContent =
          "";

        return;

      }


      /* =====================================
         LER DADOS
      ===================================== */

      try {


        const paciente =
          JSON.parse(dados);


        /* =================================
           NOME
        ================================= */

        nomePaciente.textContent =
          paciente.nome ||
          "Paciente";


        /* =================================
           SALA
        ================================= */

        sala.textContent =
          paciente.sala ||
          "—";


        /* =================================
           GUICHÊ
        ================================= */

        guiche.textContent =
          paciente.guiche ||
          "—";


        /* =================================
           HORÁRIO
        ================================= */

        if (
          paciente.horario
        ) {

          horario.textContent =
            `Chamado às ${paciente.horario}`;

        }

        else {

          horario.textContent =
            "";

        }


        /* =================================
           ANIMAÇÃO
        ================================= */

        nomePaciente.classList.remove(
          "aguardando"
        );


        nomePaciente.classList.remove(
          "novo-paciente"
        );


        void nomePaciente.offsetWidth;


        nomePaciente.classList.add(
          "novo-paciente"
        );


      }

      catch (erro) {

        console.error(
          "Erro ao ler chamada:",
          erro
        );

      }

    }


    /* =========================================
       RECEBER NOVA CHAMADA
    ========================================= */

    window.addEventListener(
      "storage",
      function(evento) {

        if (
          evento.key ===
          "pacienteTV"
        ) {

          atualizarTV();

        }

      }
    );


    /* =========================================
       INICIALIZAÇÃO
    ========================================= */

    atualizarTV();


  </script>


</body>

</html>
